name: PR-pipeline_runtime

on:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: "cann"
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  obs_path: "${{vars.OBS_PATH}}/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  repo_name: "runtime"
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: "runtime"
              target_branch: ${{ env.TARGET_BRANCH }}
              repo_url: ${{ vars.CI_PATH }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        if: "${{ default() }}"
        runs-on: ["dedicate-hosted", "x64", "small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pr:
        name: Test_get_pr
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: get_pr
            identifier: get_pr
            uses: cann/.gitcode/actions/get-pr@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              target_branch: ${{ env.TARGET_BRANCH }}
              owner: ${{ env.org_name }}
              repo: ${{ env.repo_name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              git_token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/pr_filelist.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_mod.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_precommit.txt
                ${{ steps.process_checkout.outputs.path }}/update_file_detail.txt
              object-prefix: ${{ env.obs_path }}/
        runs-on:
        - default
      JOB_shell:
        name: Test_get_shell
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: master
              token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/*
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on:
        - default
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    jobs:
      JOB_Compile_Ascend_X86:
        name: Compile_Ascend_X86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86'
          package_name: 'cann-runtime_linux-x86_64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
      JOB_Compile_Ascend_ARM:
        name: Compile_Ascend_ARM
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM'
          package_name: 'cann-runtime_linux-aarch64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
          arch: 'arm64'
      JOB_Compile_Ascend_X86_ubuntu24:
        name: Compile_Ascend_X86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_ubuntu24'
          package_name: 'cann-runtime_linux-x86_64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
          arch: 'x64'
      JOB_Compile_Ascend_ARM_ubuntu24:
        name: Compile_Ascend_ARM_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_ubuntu24'
          package_name: 'cann-runtime_linux-aarch64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
          arch: 'arm64'
      JOB_codecheck_action:
        name: CodeCheck
        uses: .gitcode/workflows/codecheck_action.yml
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_markdown:
        name: CodeCheck_staticcheck_markdown
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'markdown'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_codespell_check:
        name: CodeCheck_staticcheck_codespell_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'codespell_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_tag_closed_check:
        name: CodeCheck_staticcheck_tag_closed_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'tag_closed_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_resource_existence_check:
        name: CodeCheck_staticcheck_resource_existence_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'resource_existence_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_link_validity_check:
        name: CodeCheck_staticcheck_link_validity_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'link_validity_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: UT
    jobs:
      JOB_api_check:
        name: API_Check
        steps:
          -
            name: api-check
            identifier: api-check
            uses: cann/.gitcode/actions/api-check@master
            with:
              org_name: ${{ env.org_name }}
              mode: check
              repo_name: ${{ env.repo_name }}
              merge_id: ${{ env.MERGE_ID }}
        if: env.TARGET_BRANCH == 'master'
        runs-on: [dedicate-hosted, x64, small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.API_Check }}
      JOB_UT_Test_acl:
        name: UT_Test_acl
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_acl'
          ut_package: 'ut_cov_acl.tar.gz'
          ge_st_rt2: 'acl'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}
      JOB_UT_Test_rts_v201:
        name: UT_Test_rts_v201
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_rts_v201'
          ut_package: 'coverage_rts_v201.info'
          ge_st_rt2: 'rts_v201'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}
      JOB_UT_Test_rts_c:
        name: UT_Test_rts_c
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_rts_c'
          ut_package: 'ut_cov_rts_c.tar.gz'
          ge_st_rt2: 'rts_c'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}
      JOB_UT_Test_rts_david:
        name: UT_Test_rts_david
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_rts_david'
          ut_package: 'coverage_rts_david.info'
          ge_st_rt2: 'rts_david'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}
      JOB_UT_Test_rts_910b:
        name: UT_Test_rts_910b
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_rts_910b'
          ut_package: 'coverage_rts_910b.info'
          ge_st_rt2: 'rts_910b'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}
      JOB_UT_Test_rts_common:
        name: UT_Test_rts_common
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_rts_common'
          ut_package: 'coverage_rts_common.info'
          ge_st_rt2: 'rts_common'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_acl }}
      JOB_UT_Test_platform:
        name: UT_Test_platform
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_platform'
          ut_package: 'ut_cov_platform.tar.gz'
          ge_st_rt2: 'platform'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_platform }}
      JOB_UT_Test_qs:
        name: UT_Test_qs
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_qs'
          ut_package: 'ut_cov_qs.tar.gz'
          ge_st_rt2: 'qs'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_qs }}
      JOB_UT_Test_aicpusd:
        name: UT_Test_aicpusd
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_aicpusd'
          ut_package: 'ut_cov_aicpusd.tar.gz'
          ge_st_rt2: 'aicpusd'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_aicpusd }}
      JOB_UT_Test_tsd:
        name: UT_Test_tsd
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_tsd'
          ut_package: 'ut_cov_tsd.tar.gz'
          ge_st_rt2: 'tsd'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_tsd }}
      JOB_UT_Test_error_manager:
        name: UT_Test_error_manager
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_error_manager'
          ut_package: 'ut_cov_dfx_error_manager.tar.gz'
          ge_st_rt2: 'dfx_error_manager'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH != '9.0.0'
      JOB_UT_Test_slog:
        name: UT_Test_slog
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_slog'
          ut_package: 'ut_cov_dfx_log.tar.gz'
          ge_st_rt2: 'dfx_log'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH != '9.0.0'
      JOB_UT_Test_atrace:
        name: UT_Test_atrace
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_atrace_ut'
          ut_package: 'ut_cov_dfx_trace.tar.gz'
          ge_st_rt2: 'dfx_trace'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH != '9.0.0'
      JOB_UT_Test_msprof_part1:
        name: UT_Test_msprof_part1
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_msprof_ut'
          ut_package: 'coverage_dfx_msprof_part1.info'
          ge_st_rt2: 'dfx_msprof_part1'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH == 'master'
      JOB_UT_Test_msprof_part2:
        name: UT_Test_msprof_part2
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_msprof_ut'
          ut_package: 'coverage_dfx_msprof_part2.info'
          ge_st_rt2: 'dfx_msprof_part2'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH == 'master'
      JOB_UT_Test_adump:
        name: UT_Test_adump
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_adump'
          ut_package: 'ut_cov_dfx_adump.tar.gz'
          ge_st_rt2: 'dfx_adump'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH != '9.0.0'
      JOB_UT_Test_mmpa:
        name: UT_Test_mmpa
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_mmpa'
          ut_package: 'ut_cov_mmpa.tar.gz'
          ge_st_rt2: 'mmpa'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_mmpa }}
      JOB_UT_Test_camodel_check:
        name: UT_Test_camodel_check
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_camodel'
          ut_package: '1'
          ge_st_rt2: 'camodel'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_camodel }}
        if: env.TARGET_BRANCH == 'master'
      JOB_UT_Test_msprof:
        name: UT_Test_msprof
        uses: .gitcode/workflows/llt_action.yml
        with:
          task_name: 'UT_Test_msprof_ut'
          ut_package: 'ut_cov_dfx_msprof.tar.gz'
          ge_st_rt2: 'dfx_msprof'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_dfx }}
        if: env.TARGET_BRANCH == '9.1.0'
    pre:
    - type: auto
    fail-fast: false
  stage4:
    name: UT_report
    select: selected_by_default
    jobs:
      JOB_ut_report_rts:
        name: ut_report_rts
        select: selected_by_default
        needs: []
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: ut_report
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              cov_mode: "report"
              ut_field: "rts_common"
              modules: "rts_v201 rts_david rts_910b rts_common"
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              obs_path: ${{ env.obs_path }}
              git_token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/ut_cov_*.tar.gz
              object-prefix: ${{ env.obs_path }}/
        if: env.TARGET_BRANCH == 'master'
        runs-on: [dedicate-hosted, x64, large]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv6_v1.1073
      JOB_ut_report_dfx_msprof:
        name: ut_report_dfx_msprof
        select: selected_by_default
        needs: []
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: ut_report
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              cov_mode: "report"
              ut_field: "dfx_msprof"
              modules: "dfx_msprof_part1 dfx_msprof_part2"
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              obs_path: ${{ env.obs_path }}
              git_token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/ut_cov_*.tar.gz
              object-prefix: ${{ env.obs_path }}/
        if: env.TARGET_BRANCH == 'master'
        runs-on: [dedicate-hosted, x64, large]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv6_v1.1073
    pre:
    - type: auto
    fail-fast: true
  stage5:
    name: PreSmoke
    jobs:
      PreSmoke_A2:
        name: PreSmoke_A2
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              token: ${{secrets.GIT_TOKEN}}
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              path: "./runner"
          -
            name: Checkout gitcode
            identifier: process_checkout_gitcode
            uses: checkout
            with:
              repository: "https://gitcode.com/cann/.gitcode.git"
              ref: master
              path: "./runner/ci"
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: tar businesscode
            run: |
              echo "############${{ steps.process_checkout.outputs.path }}#################"
              cd ${{ steps.process_checkout.outputs.path }}
              tar -zcf ../smoke_data.tar.gz .
              mv ../smoke_data.tar.gz ./
          -
            name: upload
            identifier: process_upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/smoke_data.tar.gz
              object-prefix: ${{ env.obs_smoke_path }}/
          -
            name: smoke executor
            timeout-minutes: 30
            uses: manifest-management-plugin
            with:
              action: DEPLOY
              repo: ${{ steps.process_checkout.outputs.path }}
              file_path: ${{ steps.process_checkout.outputs.path }}/ci/smoke-conf/smoke-A2.yaml
              manifest_image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.Smoke_A900_npupool }}
              custom_shell_script: |-
                set -e
                export smoke_run_file_url=${{jobs.JOB_Compile_Ascend_ARM.outputs.arm_run_url}}
                export repo_name=${{env.repo_name}}
                export pr_id=${{ env.MERGE_ID }}
                export AK=${{secrets.AK}}
                export SK=${{secrets.SK}}
                mkdir -p /home/taskspace && cd /home/taskspace
                wget -nv ${{ steps.process_upload.outputs.primary-url }}
                tar -zxf $(basename "${{ steps.process_upload.outputs.primary-url }}")
                bash /home/taskspace/pre_smoke.sh
          -
            name: smoke resource clean
            uses: manifest-management-plugin
            if: ${{ always() }}
            with:
              action: CRUSH
              repo: ${{ steps.process_checkout.outputs.path }}
              file_path: ${{ steps.process_checkout.outputs.path }}/ci/smoke-conf/smoke-A2.yaml

        if: env.TARGET_BRANCH == 'master'
        runs-on: ['self-hosted','arch=arm','smoke=204']
    pre:
    - type: auto
    fail-fast: true
post:
  jobs:
    job_post:
      name: Test_finish
      steps:
        -
          name: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@master
          with:
            owner: ${{ env.org_name }}
            repo: ${{ env.repo_name }}
            run_id: ${{atomgit.workflow_run_id}}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ env.MERGE_ID }}
            apply_label: ${{ vars.APPLY_LABEL }}
      runs-on: [dedicate-hosted, x64, small]
      container:
        image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.codecheck }}
